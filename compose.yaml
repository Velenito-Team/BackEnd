services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: el-velenito-backend:latest
    ports:
      - '8080:8080'
    environment:

      MONGODB_URI: ${MONGODB_URI:?Define MONGODB_URI en .env o en tu terminal}
      VELENITO_POS_USER: ${VELENITO_POS_USER:-}
      VELENITO_RECEIPT_SECRET: ${VELENITO_RECEIPT_SECRET:-}
